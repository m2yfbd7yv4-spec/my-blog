<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <filter id="rough-soft" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="11" result="n1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="2" seed="47" result="n2"/>
    <feDisplacementMap in="SourceGraphic" in2="n1" scale="8" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feDisplacementMap in="d1" in2="n2" scale="3" xChannelSelector="R" yChannelSelector="G" result="d2"/>
    <feGaussianBlur in="d2" stdDeviation="1.4"/>
  </filter>
  <rect x="5" y="3" width="90" height="94" fill="#ffffff" filter="url(#rough-soft)"/>
</svg>
